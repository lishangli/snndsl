name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q ruff==0.17.3
      - name: ruff check
        run: ruff check snndsl tests examples --output-format=concise

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
        deps: ["full"]
        include:
          # the compiler core must work with numpy alone: torch is a backend,
          # not a prerequisite, and this job keeps it that way
          - python: "3.11"
            deps: "core"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install (core, numpy only)
        if: matrix.deps == 'core'
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ".[dev,nir]"
      - name: install (full)
        if: matrix.deps == 'full'
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -q -e ".[dev,nir,report]"
      - name: assert the core job really has no torch
        if: matrix.deps == 'core'
        run: |
          python - <<'PY'
          import importlib.util, sys
          leaked = [m for m in ("torch", "torchvision", "matplotlib")
                    if importlib.util.find_spec(m) is not None]
          if leaked:
              sys.exit(f"these were pulled into the numpy-only job: {leaked}")
          print("numpy + nir only, as intended")
          PY
      - name: pytest
        run: python -m pytest -q --cov=snndsl --cov-report=term-missing
      - name: smoke - compile and export need no backend
        run: |
          snndsl inspect examples/mnist_mlp.snn > /dev/null
          snndsl build examples/mnist_mlp.snn -o build_ci
          test -f build_ci/mnist_mlp.py
          test -f build_ci/mnist_mlp.ir.json
          test -f build_ci/mnist_mlp.nir
      - name: smoke - deploy verification (needs torch)
        if: matrix.deps == 'full'
        run: snndsl deploy examples/mnist_hw.snn --verify --batch 2 --data random --no-targets

  package:
    name: package (wheel builds and installs clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q --upgrade pip build
      - name: build sdist + wheel
        run: python -m build
      - name: install the wheel into an empty venv and run the entry point
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q dist/*.whl
          /tmp/venv/bin/python -c "import snndsl; print('version', snndsl.__version__)"
          /tmp/venv/bin/snndsl --version
          # doctor must succeed with nothing but numpy installed: that is the
          # claim the package makes, so the package job is where it gets tested
          /tmp/venv/bin/snndsl doctor
      - name: the wheel's compile path works with no backends
        run: |
          /tmp/venv/bin/snndsl build examples/mnist_mlp.snn -o /tmp/wheel_build
          test -f /tmp/wheel_build/mnist_mlp.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
